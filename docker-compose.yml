services:
  ai-pm-sandbox:
    build: .
    image: ai-pm-sandbox:latest
    container_name: ai-pm-sandbox
    restart: unless-stopped
    ports:
      - "4173:4173"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=4173
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4173/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
